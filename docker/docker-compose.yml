# AI Automotive Evolution Platform - Development Docker Compose
# Runs all services locally with hot-reload and debug configurations.
# For production, apply docker-compose.prod.yml as an override.

version: "3.9"

# ---------------------------------------------------------------------------
# Named volumes – persisted across container restarts
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

# ---------------------------------------------------------------------------
# Shared networks
# ---------------------------------------------------------------------------
networks:
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge

# ---------------------------------------------------------------------------
# Re-usable extension fragments
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  # -------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension
  # -------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-automotive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automotive_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-automotive_ai}
      # Performance tuning for development
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-automotive} -d ${POSTGRES_DB:-automotive_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Neo4j 5 with APOC plugin – graph database for evolution relationships
  # -------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.15-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_dev_password}
      NEO4J_PLUGINS: '["apoc"]'
      # Allow APOC procedures
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      # Memory settings
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2g"
      NEO4J_server_memory_pagecache_size: "512m"
      # Disable authentication requirement for Bolt in dev
      NEO4J_dbms_connector_bolt_enabled: "true"
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
      - ../scripts/init_neo4j.cypher:/docker-entrypoint-initdb.d/init.cypher:ro
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Redis 7 – task queue broker and result backend, session cache
  # -------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # -------------------------------------------------------------------------
  # MinIO – S3-compatible object storage for images and ML artifacts
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    networks:
      - backend_net
      - monitoring_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging

  # -------------------------------------------------------------------------
  # FastAPI backend – main application server
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: development
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-automotive}:${POSTGRES_PASSWORD:-automotive_dev_password}@postgres:5432/${POSTGRES_DB:-automotive_ai}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_dev_password}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
      ML_INFERENCE_URL: http://ml-inference:8001
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      DEBUG: "true"
    volumes:
      - ../backend:/app:cached
    ports:
      - "8000:8000"
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Next.js frontend
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: development
    restart: unless-stopped
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NODE_ENV: development
      PORT: "3200"
    volumes:
      - ../frontend:/app:cached
      - /app/node_modules           # Prevent host node_modules from leaking in
      - /app/.next                  # Next.js build cache stays in container
    ports:
      - "3200:3200"
    networks:
      - backend_net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Crawler – Playwright-based web crawler for automotive data
  # -------------------------------------------------------------------------
  crawler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.crawler
    restart: unless-stopped
    command: python -m app.crawler.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-automotive}:${POSTGRES_PASSWORD:-automotive_dev_password}@postgres:5432/${POSTGRES_DB:-automotive_ai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
      CRAWL_CONCURRENCY: "3"
      CRAWL_DELAY_MS: "1500"
    volumes:
      - ../crawler:/app:cached
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  # -------------------------------------------------------------------------
  # ML inference server – CLIP / DINOv2 / YOLO embeddings and predictions
  # GPU is optional in dev; remove deploy section if no GPU available.
  # -------------------------------------------------------------------------
  ml-inference:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ml
    restart: unless-stopped
    command: uvicorn app.ml.server:app --host 0.0.0.0 --port 8001 --workers 1
    environment:
      MODEL_CACHE_DIR: /models
      DEVICE: ${ML_DEVICE:-cpu}           # Override with "cuda" for GPU
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
      BATCH_SIZE: "16"
    volumes:
      - ../ml:/app:cached
      - ../models:/models               # Pre-downloaded model weights
    ports:
      - "8001:8001"
    networks:
      - backend_net
    depends_on:
      minio:
        condition: service_healthy
    # Uncomment to use GPU in dev:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s   # Model loading takes time
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Celery worker – handles async embedding and analysis tasks
  # -------------------------------------------------------------------------
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: development
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 --queues=embeddings,analysis,default
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-automotive}:${POSTGRES_PASSWORD:-automotive_dev_password}@postgres:5432/${POSTGRES_DB:-automotive_ai}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_dev_password}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
      ML_INFERENCE_URL: http://ml-inference:8001
    volumes:
      - ../backend:/app:cached
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Prometheus – metrics collection
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.49.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - backend_net
      - monitoring_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Grafana – dashboards and alerting
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3001:3000"
    networks:
      - monitoring_net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging
