# =============================================================================
# Prometheus scrape configuration – AI Automotive Evolution Platform
# =============================================================================

global:
  scrape_interval:     15s   # Default scrape frequency
  evaluation_interval: 15s   # Rule evaluation frequency
  scrape_timeout:      10s

  # External labels attached to all time series from this Prometheus instance.
  # Useful when federating or shipping to remote storage (e.g., Thanos, Mimir).
  external_labels:
    cluster:     automotive-ai
    environment: production

# ---------------------------------------------------------------------------
# Alerting – reference to Alertmanager
# ---------------------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 5s

# ---------------------------------------------------------------------------
# Rule files – alerting and recording rules
# ---------------------------------------------------------------------------
rule_files:
  - "/etc/prometheus/rules/alerts.yml"
  - "/etc/prometheus/rules/recording.yml"

# ---------------------------------------------------------------------------
# Scrape configurations
# ---------------------------------------------------------------------------
scrape_configs:

  # --------------------------------------------------------------------------
  # Prometheus self-monitoring
  # --------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # --------------------------------------------------------------------------
  # FastAPI backend – exposes /metrics via prometheus-fastapi-instrumentator
  # --------------------------------------------------------------------------
  - job_name: backend
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend
          team:    platform

  # --------------------------------------------------------------------------
  # ML Inference server – custom metrics (GPU utilization, inference latency)
  # --------------------------------------------------------------------------
  - job_name: ml_inference
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-inference:8001"]
        labels:
          service: ml-inference
          team:    ml

  # --------------------------------------------------------------------------
  # PostgreSQL exporter (postgres_exporter sidecar or standalone container)
  # --------------------------------------------------------------------------
  - job_name: postgres
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres
          db:      automotive_ai

  # --------------------------------------------------------------------------
  # Redis exporter
  # --------------------------------------------------------------------------
  - job_name: redis
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

  # --------------------------------------------------------------------------
  # MinIO – built-in Prometheus endpoint
  # --------------------------------------------------------------------------
  - job_name: minio
    scrape_interval: 30s
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
        labels:
          service: minio

  # --------------------------------------------------------------------------
  # cAdvisor – container resource utilization
  # --------------------------------------------------------------------------
  - job_name: cadvisor
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor

  # --------------------------------------------------------------------------
  # Node exporter – host-level metrics
  # --------------------------------------------------------------------------
  - job_name: node
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service:    node-exporter
          instance:   host

  # --------------------------------------------------------------------------
  # Nginx exporter (nginx-prometheus-exporter)
  # --------------------------------------------------------------------------
  - job_name: nginx
    scrape_interval: 15s
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: nginx

  # --------------------------------------------------------------------------
  # Celery – flower metrics or celery-exporter
  # --------------------------------------------------------------------------
  - job_name: celery
    scrape_interval: 30s
    static_configs:
      - targets: ["celery-exporter:9540"]
        labels:
          service: celery
          queue:   embeddings

  # --------------------------------------------------------------------------
  # Neo4j – built-in metrics endpoint (requires NEO4J_metrics_prometheus_enabled=true)
  # --------------------------------------------------------------------------
  - job_name: neo4j
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["neo4j:2004"]
        labels:
          service: neo4j
