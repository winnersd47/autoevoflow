# AI Automotive Evolution Platform - Production Override
# Apply on top of docker-compose.yml:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Key differences from dev:
#   - No direct port exposures except Nginx (80/443)
#   - Resource limits to prevent runaway containers
#   - External (pre-created) named volumes for data durability
#   - Production env vars pulled from .env.prod or runtime secrets
#   - Restart policies and healthcheck tuning

version: "3.9"

# ---------------------------------------------------------------------------
# External volumes – must be created before first deploy:
#   docker volume create automotive_postgres_data
#   docker volume create automotive_neo4j_data  ...etc
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    external: true
    name: automotive_postgres_data
  neo4j_data:
    external: true
    name: automotive_neo4j_data
  neo4j_logs:
    external: true
    name: automotive_neo4j_logs
  neo4j_import:
    external: true
    name: automotive_neo4j_import
  neo4j_plugins:
    external: true
    name: automotive_neo4j_plugins
  redis_data:
    external: true
    name: automotive_redis_data
  minio_data:
    external: true
    name: automotive_minio_data
  prometheus_data:
    external: true
    name: automotive_prometheus_data
  grafana_data:
    external: true
    name: automotive_grafana_data
  nginx_certs:
    external: true
    name: automotive_nginx_certs

networks:
  backend_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  monitoring_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

services:
  # -------------------------------------------------------------------------
  # Nginx – sole public-facing entry point
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - backend_net
    depends_on:
      - backend
      - frontend
      - ml-inference
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

  # -------------------------------------------------------------------------
  # PostgreSQL production overrides
  # -------------------------------------------------------------------------
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: []      # Remove port exposure; only reachable via backend_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  # -------------------------------------------------------------------------
  # Neo4j production overrides
  # -------------------------------------------------------------------------
  neo4j:
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: "4g"
      NEO4J_server_memory_pagecache_size: "2g"
    ports: []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8G
        reservations:
          cpus: "0.5"
          memory: 2G

  # -------------------------------------------------------------------------
  # Redis production overrides
  # -------------------------------------------------------------------------
  redis:
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
    ports: []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5G
        reservations:
          cpus: "0.2"
          memory: 512M

  # -------------------------------------------------------------------------
  # MinIO production overrides
  # -------------------------------------------------------------------------
  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports: []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.2"
          memory: 512M

  # -------------------------------------------------------------------------
  # Backend production overrides
  # -------------------------------------------------------------------------
  backend:
    build:
      target: production
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --access-log
      --proxy-headers
      --forwarded-allow-ips=*
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ML_INFERENCE_URL: http://ml-inference:8001
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEBUG: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes: []    # No source-code mounts in production
    ports: []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # -------------------------------------------------------------------------
  # Frontend production overrides
  # -------------------------------------------------------------------------
  frontend:
    build:
      target: production
    command: node server.js
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL}
      NODE_ENV: production
    volumes: []
    ports: []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.2"
          memory: 256M

  # -------------------------------------------------------------------------
  # Crawler production overrides
  # -------------------------------------------------------------------------
  crawler:
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      CRAWL_CONCURRENCY: "5"
      CRAWL_DELAY_MS: "2000"
    volumes: []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.2"
          memory: 256M

  # -------------------------------------------------------------------------
  # ML Inference production overrides (GPU-enabled)
  # -------------------------------------------------------------------------
  ml-inference:
    environment:
      MODEL_CACHE_DIR: /models
      DEVICE: cuda
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BATCH_SIZE: "32"
    volumes:
      - /opt/automotive-ai/models:/models:ro   # Bind-mount pre-downloaded models
    ports: []
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 16G
        reservations:
          cpus: "1.0"
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # -------------------------------------------------------------------------
  # Celery worker production overrides
  # -------------------------------------------------------------------------
  celery-worker:
    build:
      target: production
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=warning
      --concurrency=8
      --queues=embeddings,analysis,default
      --max-tasks-per-child=1000
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ML_INFERENCE_URL: http://ml-inference:8001
      SECRET_KEY: ${SECRET_KEY}
    volumes: []
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G

  # -------------------------------------------------------------------------
  # Prometheus production overrides
  # -------------------------------------------------------------------------
  prometheus:
    ports: []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.2"
          memory: 512M

  # -------------------------------------------------------------------------
  # Grafana production overrides
  # -------------------------------------------------------------------------
  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST}
      GF_SMTP_USER: ${SMTP_USER}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM}
    ports: []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
