# =============================================================================
# Nginx configuration – AI Automotive Evolution Platform
# Handles: TLS termination, gzip, rate limiting, security headers,
#          reverse proxy to backend (8000), frontend (3200), ml (8001).
# =============================================================================

# Auto-detect available worker processes (matches CPU count)
worker_processes auto;

# Maximum number of open file descriptors per worker
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept       on;
    use                epoll;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---------------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ---------------------------------------------------------------------------
    # Performance
    # ---------------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 50M;    # Allow large image uploads

    # ---------------------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # ---------------------------------------------------------------------------
    # Rate limiting zones
    # ---------------------------------------------------------------------------
    # General API: 10 requests/second per IP (burst 20)
    limit_req_zone  $binary_remote_addr zone=api_limit:10m    rate=10r/s;
    # ML / expensive endpoints: 2 requests/second per IP
    limit_req_zone  $binary_remote_addr zone=ml_limit:10m     rate=2r/s;
    # Auth endpoints: 5 requests/minute per IP
    limit_req_zone  $binary_remote_addr zone=auth_limit:10m   rate=5r/m;

    limit_req_status 429;

    # ---------------------------------------------------------------------------
    # Upstream definitions
    # ---------------------------------------------------------------------------
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3200;
        keepalive 16;
    }

    upstream ml_inference {
        server ml-inference:8001;
        keepalive 8;
    }

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # All other traffic → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS main server
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name ${NGINX_SERVER_NAME};

        # ------------------------------------------------------------------
        # SSL / TLS – Let's Encrypt managed by certbot
        # ------------------------------------------------------------------
        ssl_certificate     /etc/letsencrypt/live/${NGINX_SERVER_NAME}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${NGINX_SERVER_NAME}/privkey.pem;

        # Modern TLS configuration (TLSv1.2 minimum)
        ssl_protocols              TLSv1.2 TLSv1.3;
        ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers  off;
        ssl_session_cache          shared:SSL:10m;
        ssl_session_timeout        1d;
        ssl_session_tickets        off;
        ssl_stapling               on;
        ssl_stapling_verify        on;

        # ------------------------------------------------------------------
        # Security headers
        # ------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                       always;
        add_header X-Frame-Options           "SAMEORIGIN"                                    always;
        add_header X-XSS-Protection          "1; mode=block"                                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"      always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:;"
            always;

        # ------------------------------------------------------------------
        # REST API – FastAPI backend
        # ------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering    off;
        }

        # Auth endpoints with stricter rate limiting
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass         http://backend/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # WebSocket endpoint for real-time updates
        location /ws/ {
            proxy_pass          http://backend/ws/;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host       $host;
            proxy_read_timeout  86400s;
        }

        # ------------------------------------------------------------------
        # ML Inference API – separate rate limiting for expensive operations
        # ------------------------------------------------------------------
        location /ml/ {
            limit_req zone=ml_limit burst=5 nodelay;

            proxy_pass         http://ml_inference/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # ML inference can be slow; set generous timeouts
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            client_max_body_size 20M;   # Image uploads
        }

        # ------------------------------------------------------------------
        # Static assets – aggressive caching
        # ------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://frontend/_next/static/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Favicon and robots
        location = /favicon.ico {
            proxy_pass http://frontend/favicon.ico;
            add_header Cache-Control "public, max-age=86400";
            access_log off;
        }

        location = /robots.txt {
            proxy_pass http://frontend/robots.txt;
            access_log off;
        }

        # ------------------------------------------------------------------
        # Frontend – Next.js catch-all
        # ------------------------------------------------------------------
        location / {
            proxy_pass         http://frontend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
        }

        # ------------------------------------------------------------------
        # Health check endpoint (bypasses rate limiting)
        # ------------------------------------------------------------------
        location = /health {
            access_log off;
            proxy_pass http://backend/health;
        }

        # Block access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
