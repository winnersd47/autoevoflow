---
# =============================================================================
# Prometheus – ServiceAccount
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: automotive-ai
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: automotive-ai

---
# =============================================================================
# Prometheus – ClusterRole (needs cluster-wide pod/endpoint discovery)
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-automotive-ai
  labels:
    app: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]

---
# =============================================================================
# Prometheus – ClusterRoleBinding
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-automotive-ai
  labels:
    app: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind:     ClusterRole
  name:     prometheus-automotive-ai
subjects:
  - kind:      ServiceAccount
    name:      prometheus
    namespace: automotive-ai

---
# =============================================================================
# Prometheus – ConfigMap (prometheus.yml)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: automotive-ai
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s
      scrape_timeout:      10s
      external_labels:
        cluster: automotive-ai
        environment: production

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []
          # Uncomment when Alertmanager is deployed:
          # - targets: ["alertmanager:9093"]

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:
      # -----------------------------------------------------------------------
      # Kubernetes API server
      # -----------------------------------------------------------------------
      - job_name: kubernetes-apiservers
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # -----------------------------------------------------------------------
      # Kubernetes nodes (kubelet metrics)
      # -----------------------------------------------------------------------
      - job_name: kubernetes-nodes
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics

      # -----------------------------------------------------------------------
      # cAdvisor (container resource metrics)
      # -----------------------------------------------------------------------
      - job_name: kubernetes-cadvisor
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      # -----------------------------------------------------------------------
      # Pod annotation-based autodiscovery
      # Pods with prometheus.io/scrape: "true" are scraped automatically.
      # -----------------------------------------------------------------------
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [automotive-ai]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # -----------------------------------------------------------------------
      # Named service scraping
      # -----------------------------------------------------------------------
      - job_name: backend
        static_configs:
          - targets: ["backend:8000"]
        metrics_path: /metrics

      - job_name: ml-inference
        static_configs:
          - targets: ["ml-inference:8001"]
        metrics_path: /metrics

      - job_name: postgres-exporter
        static_configs:
          - targets: ["postgres-exporter:9187"]

      - job_name: redis-exporter
        static_configs:
          - targets: ["redis-exporter:9121"]

      - job_name: prometheus-self
        static_configs:
          - targets: ["localhost:9090"]

---
# =============================================================================
# Prometheus – PersistentVolumeClaim (TSDB data)
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data-pvc
  namespace: automotive-ai
  labels:
    app: prometheus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard

---
# =============================================================================
# Prometheus – Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: automotive-ai
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/version: "2.48.0"
    app.kubernetes.io/part-of: automotive-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  strategy:
    type: Recreate    # PVC is RWO; can't have two writers
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus

      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534

      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chmod 777 /prometheus"]
          volumeMounts:
            - name: data
              mountPath: /prometheus
          securityContext:
            runAsUser: 0

      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=30d"
            - "--storage.tsdb.retention.size=18GB"
            - "--web.enable-lifecycle"
            - "--web.enable-admin-api"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP

          resources:
            requests:
              cpu:    "500m"
              memory: "1Gi"
            limits:
              cpu:    "2"
              memory: "4Gi"

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds:       15
            timeoutSeconds:      5
            failureThreshold:    3

          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds:       10
            timeoutSeconds:      5
            failureThreshold:    3

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus

      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data-pvc

      terminationGracePeriodSeconds: 60

---
# =============================================================================
# Prometheus – Service (ClusterIP)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: automotive-ai
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name:       http
      port:       9090
      targetPort: http
      protocol:   TCP

---
# =============================================================================
# ServiceMonitor CRD example (requires Prometheus Operator / kube-prometheus-stack)
# This is included as a reference; apply only if the CRD is installed.
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: automotive-ai-backend
  namespace: automotive-ai
  labels:
    app: backend
    release: kube-prometheus-stack    # Must match operator's serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames:
      - automotive-ai
  endpoints:
    - port:     http
      path:     /metrics
      interval: 15s
      scrapeTimeout: 10s
