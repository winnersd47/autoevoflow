---
# =============================================================================
# Secrets – automotive-ai-platform
#
# WARNING: This file contains TEMPLATE PLACEHOLDER values.
# It is committed to git for reference ONLY.
# The actual secrets.yaml with real values must NEVER be committed.
#
# To generate real values:
#   kubectl create secret generic automotive-ai-secrets \
#     --from-literal=DB_PASSWORD=$(openssl rand -base64 32) \
#     --from-literal=JWT_SECRET=$(openssl rand -base64 64) \
#     ... (see below)
#
# Or use External Secrets Operator / Vault / AWS Secrets Manager and remove
# this file entirely – that is the recommended production approach.
#
# All values below are base64-encoded placeholder strings.
# Replace each value with: echo -n 'your-actual-secret' | base64
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: automotive-ai-secrets
  namespace: automotive-ai
  labels:
    app.kubernetes.io/part-of: automotive-ai
  annotations:
    # Reminder to seal or externalize before production
    note: "REPLACE ALL VALUES BEFORE DEPLOYING – these are placeholders only"
type: Opaque
data:
  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  # echo -n 'REPLACE_WITH_STRONG_PASSWORD' | base64
  DB_PASSWORD:         UkVQTEFDRV9XSVRIX1NUUk9OR19QQVNTV09SRA==

  # echo -n 'postgresql+asyncpg://automotive_user:PASSWORD@postgres:5432/automotive_ai' | base64
