---
# =============================================================================
# Main ConfigMap – automotive-ai-platform
# All non-secret environment variables shared across services.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: automotive-ai-config
  namespace: automotive-ai
  labels:
    app.kubernetes.io/part-of: automotive-ai
data:
  # ---------------------------------------------------------------------------
  # Environment
  # ---------------------------------------------------------------------------
  ENVIRONMENT:  "production"
  LOG_LEVEL:    "info"
  DEBUG:        "false"

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  DB_HOST:      "postgres"
  DB_PORT:      "5432"
  DB_NAME:      "automotive_ai"
  DB_USER:      "automotive_user"
  DB_POOL_MIN:  "5"
  DB_POOL_MAX:  "20"
  DB_POOL_TIMEOUT: "30"

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  REDIS_HOST:      "redis"
  REDIS_PORT:      "6379"
  REDIS_DB:        "0"
  REDIS_MAX_CONN:  "50"
  CACHE_TTL_SECS:  "3600"

  # ---------------------------------------------------------------------------
  # Neo4j
  # ---------------------------------------------------------------------------
  NEO4J_URI:   "bolt://neo4j:7687"
  NEO4J_USER:  "neo4j"
  NEO4J_DATABASE: "neo4j"

  # ---------------------------------------------------------------------------
  # MinIO / S3-compatible object storage
  # ---------------------------------------------------------------------------
  MINIO_ENDPOINT:  "minio:9000"
  MINIO_SECURE:    "false"
  MINIO_BUCKET_IMAGES:  "vehicle-images"
  MINIO_BUCKET_MODELS:  "ml-models"
  MINIO_BUCKET_EXPORTS: "data-exports"

  # AWS Region (for real S3 or when MinIO is replaced with S3)
  AWS_REGION: "us-east-1"

  # ---------------------------------------------------------------------------
  # Application – backend
  # ---------------------------------------------------------------------------
  APP_HOST:          "0.0.0.0"
  APP_PORT:          "8000"
  APP_WORKERS:       "4"
  APP_RELOAD:        "false"

  # JWT
  JWT_ALGORITHM:       "HS256"
  JWT_ACCESS_TTL_MIN:  "30"
  JWT_REFRESH_TTL_DAYS: "7"

  # CORS & host validation
  CORS_ORIGINS:    "https://yourdomain.com,https://www.yourdomain.com"
  ALLOWED_HOSTS:   "yourdomain.com,www.yourdomain.com"

  # OAuth – client IDs (secrets are in Secret resource)
  GOOGLE_CLIENT_ID:  "REPLACE_WITH_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
  GITHUB_CLIENT_ID:  "REPLACE_WITH_GITHUB_CLIENT_ID"

  # ---------------------------------------------------------------------------
  # ML Inference service
  # ---------------------------------------------------------------------------
  ML_INFERENCE_URL:     "http://ml-inference:8001"
  ML_REQUEST_TIMEOUT:   "120"
  ML_RETRY_ATTEMPTS:    "3"
  ML_RETRY_DELAY_SECS:  "2"

  # ---------------------------------------------------------------------------
  # Crawlers
  # ---------------------------------------------------------------------------
  CRAWLER_CONCURRENCY:   "4"
  CRAWLER_DELAY_MS:      "1000"
  CRAWLER_USER_AGENT:    "AutomotiveAI-Bot/1.0 (+https://yourdomain.com/bot)"
  CRAWLER_MAX_RETRIES:   "3"
  CRAWLER_TIMEOUT_SECS:  "30"

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------
  METRICS_ENABLED:       "true"
  METRICS_PORT:          "8000"
  METRICS_PATH:          "/metrics"
  SENTRY_ENVIRONMENT:    "production"
  SENTRY_TRACES_RATE:    "0.1"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""   # Set if using OpenTelemetry collector

  # ---------------------------------------------------------------------------
  # Email (SMTP)
  # ---------------------------------------------------------------------------
  SMTP_HOST:     "smtp.sendgrid.net"
  SMTP_PORT:     "587"
  SMTP_USER:     "apikey"
  SMTP_USE_TLS:  "true"
  EMAIL_FROM:    "noreply@yourdomain.com"
