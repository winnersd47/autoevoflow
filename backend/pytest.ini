[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
# Evals call live OpenAI API — run separately with:
#   pytest tests/evals/ -v
# Skip when OPENAI_API_KEY is absent (module-level skip handles this automatically)
filterwarnings =
    ignore::DeprecationWarning
