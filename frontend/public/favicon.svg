<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Background -->
  <rect width="40" height="40" rx="10" fill="#09080A"/>
  <rect width="40" height="40" rx="10" fill="url(#bg)" />

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="14" x2="40" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="chain" x1="8" y1="10" x2="32" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F97316" stop-opacity="0.4"/>
      <stop offset="50%"  stop-color="#F97316"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Evolution chain: past · present · future -->
  <line x1="10" y1="10" x2="30" y2="10" stroke="url(#chain)" stroke-width="1" stroke-linecap="round"/>
  <circle cx="10" cy="10" r="1.6" fill="#F97316" opacity="0.45"/>
  <circle cx="20" cy="10" r="2.4" fill="#F97316"/>
  <circle cx="20" cy="10" r="1"   fill="#09080A"/>
  <circle cx="30" cy="10" r="1.6" fill="#F97316" opacity="0.45"/>
  <path d="M12 9.3 L14.5 10 L12 10.7" fill="#F97316" opacity="0.5"/>
  <path d="M25.5 9.3 L28 10 L25.5 10.7" fill="#F97316" opacity="0.5"/>

  <!-- Car cabin -->
  <path d="M5 28 L8 21 L13 17 L20 16 L27 17 L32 21 L35 28"
    stroke="url(#car)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

  <!-- Wheels as graph nodes -->
  <circle cx="11" cy="29" r="4"   fill="none" stroke="url(#car)" stroke-width="2.2"/>
  <circle cx="11" cy="29" r="1.4" fill="#F97316"/>
  <circle cx="29" cy="29" r="4"   fill="none" stroke="url(#car)" stroke-width="2.2"/>
  <circle cx="29" cy="29" r="1.4" fill="#F97316"/>

  <!-- Ground line -->
  <line x1="7" y1="33" x2="33" y2="33" stroke="#F97316" stroke-width="0.8" stroke-opacity="0.2" stroke-linecap="round"/>
</svg>
