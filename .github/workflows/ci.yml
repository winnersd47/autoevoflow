name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY:      ghcr.io
  IMAGE_PREFIX:  ${{ github.repository }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Backend quality checks
  # ============================================================================
  backend-quality:
    name: Backend – lint / type-check / tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER:     test
          POSTGRES_DB:       test_automotive
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_automotive
      REDIS_URL:    redis://localhost:6379/0
      ENVIRONMENT:  test
      SECRET_KEY:   test-secret-key-for-ci-only-not-production
      JWT_SECRET:   test-jwt-secret-for-ci-only-not-production
      LOG_LEVEL:    DEBUG

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Ruff lint
        run: cd backend && ruff check . --output-format=github

      - name: Ruff format check
        run: cd backend && ruff format --check .

      - name: Mypy type check
        run: cd backend && mypy app/ --ignore-missing-imports --show-error-codes

      - name: Run DB migrations (test DB)
        run: cd backend && alembic upgrade head

      - name: Pytest with coverage
        run: >
          cd backend &&
          pytest tests/ -v
          --cov=app
          --cov-report=xml
          --cov-report=term-missing
          --tb=short
          -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Frontend quality checks
  # ============================================================================
  frontend-quality:
    name: Frontend – lint / type-check / tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npm run lint

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Unit tests with coverage
        run: cd frontend && npm test -- --coverage --watchAll=false --ci
        env:
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # ML service quality checks
  # ============================================================================
  ml-quality:
    name: ML – lint / type-check / unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ml-${{ runner.os }}-${{ hashFiles('ml/requirements*.txt') }}
          restore-keys: |
            pip-ml-${{ runner.os }}-

      - name: Install ML dependencies (CPU-only for CI)
        run: |
          pip install -r ml/requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Ruff lint
        run: cd ml && ruff check . --output-format=github

      - name: Mypy type check
        run: cd ml && mypy app/ --ignore-missing-imports

      - name: Run unit tests (no GPU required)
        run: cd ml && pytest tests/unit/ -v -q

  # ============================================================================
  # Security scanning
  # ============================================================================
  security-scan:
    name: Security – dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python safety check
        run: |
          pip install safety
          safety check -r backend/requirements.txt --output text || true

      - name: npm audit
        run: cd frontend && npm audit --audit-level=high || true

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "infrastructure/"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  # ============================================================================
  # Build and push Docker images
  # Only runs on push events (not PRs) after quality checks pass.
  # ============================================================================
  build-and-push:
    name: Build & push – ${{ matrix.service }}
    needs: [backend-quality, frontend-quality, ml-quality]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: docker/Dockerfile.backend
          - service: frontend
            context: .
            dockerfile: docker/Dockerfile.frontend
          - service: crawler
            context: .
            dockerfile: docker/Dockerfile.crawler
          - service: ml
            context: .
            dockerfile: docker/Dockerfile.ml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context:     ${{ matrix.context }}
          file:        ${{ matrix.dockerfile }}
          push:        true
          tags:        ${{ steps.meta.outputs.tags }}
          labels:      ${{ steps.meta.outputs.labels }}
          cache-from:  type=gha
          cache-to:    type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:  "ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}"
          format:     "table"
          exit-code:  "0"
          severity:   "CRITICAL,HIGH"
