name: AutoEvoFlow — Прогноз следующего поколения (batch)

on:
  schedule:
    - cron: '0 8 * * 1'   # 11:00 MSK (UTC+3), по понедельникам
  workflow_dispatch:        # ручной запуск из Actions → Run workflow

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Generate predictions for active models
        working-directory: frontend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-nextgen-predictions.js

      - name: Commit predictions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/models/
          git diff --staged --quiet || \
            git commit -m "chore: precompute next-gen AI predictions [skip ci]" && \
            git push
